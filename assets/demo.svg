<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f2937"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <filter id="termGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Terminal window -->
  <rect width="800" height="500" rx="14" ry="14" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect width="800" height="42" rx="14" ry="14" fill="url(#headerGrad)"/>
  <rect y="28" width="800" height="14" fill="url(#headerGrad)"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="21" r="7" fill="#ff5f57"/>
  <circle cx="44" cy="21" r="7" fill="#febc2e"/>
  <circle cx="66" cy="21" r="7" fill="#28c840"/>

  <!-- Title -->
  <text x="400" y="26" font-family="monospace" font-size="13" fill="#8b949e" text-anchor="middle">hunt-agent — authorized security testing agent</text>

  <!-- Line 1: prompt + command -->
  <text x="30" y="78" font-family="monospace" font-size="13" fill="#8b949e">❯</text>
  <text x="46" y="78" font-family="monospace" font-size="13" fill="#00d4ff" filter="url(#termGlow)">hunt-agent</text>
  <text x="132" y="78" font-family="monospace" font-size="13" fill="#e6edf3"> --version</text>

  <!-- Output: version -->
  <text x="30" y="100" font-family="monospace" font-size="13" fill="#39d353">hunt-agent 0.1.0-dev</text>

  <!-- Spacer -->
  <text x="30" y="126" font-family="monospace" font-size="13" fill="#8b949e">❯</text>
  <text x="46" y="126" font-family="monospace" font-size="13" fill="#00d4ff" filter="url(#termGlow)">hunt-agent</text>
  <text x="132" y="126" font-family="monospace" font-size="13" fill="#e6edf3"> --provider-status</text>

  <!-- Provider status output -->
  <text x="30" y="150" font-family="monospace" font-size="12" fill="#39d353">claude-code  · Claude Code  · local-cli · </text>
  <text x="388" y="150" font-family="monospace" font-size="12" fill="#39d353" font-weight="bold">ready</text>
  <text x="432" y="150" font-family="monospace" font-size="12" fill="#8b949e"> · 1 models</text>
  <text x="30" y="168" font-family="monospace" font-size="12" fill="#39d353">codex-cli    · Codex CLI   · local-cli · </text>
  <text x="374" y="168" font-family="monospace" font-size="12" fill="#39d353" font-weight="bold">ready</text>
  <text x="418" y="168" font-family="monospace" font-size="12" fill="#8b949e"> · 1 models</text>
  <text x="30" y="186" font-family="monospace" font-size="12" fill="#8b949e">anthropic    · Anthropic   · api       · disabled · set ANTHROPIC_API_KEY</text>
  <text x="30" y="204" font-family="monospace" font-size="12" fill="#8b949e">ollama       · Ollama      · local-llm · </text>
  <text x="296" y="204" font-family="monospace" font-size="12" fill="#8b949e">checking...</text>

  <!-- Model test command -->
  <text x="30" y="234" font-family="monospace" font-size="13" fill="#8b949e">❯</text>
  <text x="46" y="234" font-family="monospace" font-size="13" fill="#00d4ff" filter="url(#termGlow)">hunt-agent</text>
  <text x="132" y="234" font-family="monospace" font-size="13" fill="#e6edf3"> model test claude-code</text>

  <text x="30" y="256" font-family="monospace" font-size="13" fill="#39d353">ok claude-code:claude-code (4731ms)</text>
  <text x="30" y="274" font-family="monospace" font-size="13" fill="#39d353">OK</text>

  <!-- Assess command -->
  <text x="30" y="304" font-family="monospace" font-size="13" fill="#8b949e">❯</text>
  <text x="46" y="304" font-family="monospace" font-size="13" fill="#00d4ff" filter="url(#termGlow)">hunt-agent</text>
  <text x="132" y="304" font-family="monospace" font-size="13" fill="#e6edf3"> assess --headless --target http://127.0.0.1:3000 \</text>
  <text x="46" y="322" font-family="monospace" font-size="13" fill="#e6edf3">    --objective </text>
  <text x="170" y="322" font-family="monospace" font-size="13" fill="#f78166">"Test orders API for broken access control"</text>
  <text x="46" y="340" font-family="monospace" font-size="13" fill="#e6edf3">    --model claude-code --max-steps 12</text>

  <!-- Assessment output -->
  <text x="30" y="366" font-family="monospace" font-size="12" fill="#8b949e">[assess] target: http://127.0.0.1:3000  scope: OK  provider: claude-code</text>
  <text x="30" y="384" font-family="monospace" font-size="12" fill="#e6edf3">[step 1] Planning security assessment...</text>
  <text x="30" y="402" font-family="monospace" font-size="12" fill="#8b949e">[tool]   http GET /api/orders/1</text>
  <text x="30" y="420" font-family="monospace" font-size="12" fill="#8b949e">[tool]   http GET /api/orders/2</text>
  <text x="30" y="438" font-family="monospace" font-size="12" fill="#f78166">[finding] IDOR — /api/orders/:id does not verify ownership</text>

  <!-- Blinking cursor -->
  <rect x="30" y="452" width="9" height="16" rx="1" fill="#00d4ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="800" height="2" fill="#00d4ff" opacity="0.15">
    <animate attributeName="y" values="42;498;42" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.15;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
