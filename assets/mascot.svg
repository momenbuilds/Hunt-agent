<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Body (terminal shape) -->
  <rect x="20" y="30" width="160" height="130" rx="12" ry="12" fill="url(#bodyGrad)" stroke="#00d4ff" stroke-width="2"/>

  <!-- Screen -->
  <rect x="30" y="42" width="140" height="100" rx="6" ry="6" fill="url(#screenGrad)"/>

  <!-- Scan line glow -->
  <rect x="30" y="80" width="140" height="2" fill="url(#glowGrad)" opacity="0.6"/>

  <!-- Eyes (terminal cursors) -->
  <rect x="58" y="62" width="18" height="22" rx="3" fill="#00d4ff" filter="url(#glow)" opacity="0.9"/>
  <rect x="124" y="62" width="18" height="22" rx="3" fill="#00d4ff" filter="url(#glow)" opacity="0.9"/>

  <!-- Eye pupils (dark, hacker style) -->
  <rect x="63" y="66" width="8" height="14" rx="2" fill="#0d1117"/>
  <rect x="129" y="66" width="8" height="14" rx="2" fill="#0d1117"/>

  <!-- Mouth (terminal prompt) -->
  <text x="50" y="108" font-family="monospace" font-size="11" fill="#00d4ff" filter="url(#softglow)">$ hunt-agent</text>

  <!-- Blinking cursor after prompt -->
  <rect x="148" y="97" width="7" height="12" rx="1" fill="#00d4ff" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Code lines (decorative) -->
  <text x="50" y="125" font-family="monospace" font-size="7" fill="#39d353" opacity="0.8">  scanning target...</text>
  <text x="50" y="137" font-family="monospace" font-size="7" fill="#f78166" opacity="0.7">  [!] IDOR found</text>

  <!-- Antenna (for the "agent" feel) -->
  <line x1="100" y1="30" x2="100" y2="10" stroke="#00d4ff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="100" cy="7" r="4" fill="#00d4ff" filter="url(#glow)">
    <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Legs/base -->
  <rect x="55" y="160" width="20" height="30" rx="5" fill="url(#bodyGrad)" stroke="#00d4ff" stroke-width="1.5"/>
  <rect x="125" y="160" width="20" height="30" rx="5" fill="url(#bodyGrad)" stroke="#00d4ff" stroke-width="1.5"/>

  <!-- Feet -->
  <rect x="45" y="185" width="35" height="10" rx="5" fill="#00d4ff" opacity="0.8"/>
  <rect x="120" y="185" width="35" height="10" rx="5" fill="#00d4ff" opacity="0.8"/>

  <!-- Arms -->
  <rect x="10" y="70" width="15" height="50" rx="7" fill="url(#bodyGrad)" stroke="#00d4ff" stroke-width="1.5" transform="rotate(-10,17,95)"/>
  <rect x="175" y="70" width="15" height="50" rx="7" fill="url(#bodyGrad)" stroke="#00d4ff" stroke-width="1.5" transform="rotate(10,182,95)"/>

  <!-- Name tag -->
  <rect x="55" y="200" width="90" height="16" rx="4" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1"/>
  <text x="100" y="212" font-family="monospace" font-size="8" fill="#00d4ff" text-anchor="middle" font-weight="bold">HUNT-AGENT</text>
</svg>
